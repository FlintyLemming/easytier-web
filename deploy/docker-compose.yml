# The original easytier-web (API + device registration) plus Caddy serving this console.
# Build the console first (`npm run build` writes ../dist), then from the repository root:
#
#   SITE_ADDRESS=console.example.com docker compose -f deploy/docker-compose.yml up -d
#
# Paths and ports can be changed with ET_DATA_DIR, ET_DIST_DIR, ET_HTTP_PORT, ET_HTTPS_PORT and
# ET_UDP_PORT (see deploy/README.md).
services:
  easytier-web:
    image: easytier/easytier:v2.7.1
    entrypoint: ["easytier-web-embed"]
    command: ["--disable-registration"]
    volumes:
      # et.db lives here; back it up before upgrading (docs/upgrade-runbook.md).
      - "${ET_DATA_DIR:-./data}:/app"
    ports:
      # Device registration: easytier-core --config-server udp://<host>:22020/<user>
      - "${ET_UDP_PORT:-22020}:22020/udp"
      # The original embedded frontend (and the API) listen on 11211. Caddy reaches it over the
      # compose network, so it is not published. To keep the original frontend for comparison or
      # as a fallback, publish it (ideally only on localhost):
      # - "127.0.0.1:11211:11211"
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-localhost}"
    volumes:
      - "${ET_DIST_DIR:-../dist}:/srv:ro"
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${ET_HTTP_PORT:-80}:80"
      - "${ET_HTTPS_PORT:-443}:443"
      - "${ET_HTTPS_PORT:-443}:443/udp"
    depends_on: [easytier-web]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
