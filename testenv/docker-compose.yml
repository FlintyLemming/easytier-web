services:
  web:
    image: easytier/easytier:${ET_WEB_TAG:-v2.7.1}
    entrypoint: ["easytier-web-embed"]
    hostname: web
    volumes:
      - "${ET_DATA_DIR:-./data}:/app"
    ports:
      - "11211:11211"
      - "22020:22020/udp"

  core1:
    image: easytier/easytier:${ET_CORE_TAG:-v2.6.4}
    hostname: core1
    command: ["--config-server", "udp://web:22020/admin", "--machine-id", "11111111-1111-4111-8111-111111111111"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    depends_on: [web]

  core2:
    image: easytier/easytier:${ET_CORE_TAG:-v2.6.4}
    hostname: core2
    command: ["--config-server", "udp://web:22020/admin", "--machine-id", "22222222-2222-4222-8222-222222222222"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    depends_on: [web]

  core3:
    image: easytier/easytier:${ET_CORE_TAG:-v2.6.4}
    hostname: core3
    command: ["--config-server", "udp://web:22020/admin", "--machine-id", "33333333-3333-4333-8333-333333333333"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    depends_on: [web]
